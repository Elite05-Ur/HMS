services:
  - type: web
    runtime: node
    name: hmsystem-api
    rootDir: .
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: TOKEN
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://hmsystem-frontend.onrender.com

  - type: web
    runtime: static
    name: hmsystem-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://hmsystem-api.onrender.com/api